name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds per workload (1..60)
        required: true
        default: '10'
        type: string
      repeats:
        description: Repetitions per workload (1..9)
        required: true
        default: '3'
        type: string
      baseline:
        description: Optional Zig 0.17.0 baseline ref, built on this same runner
        default: ''
        type: string
      workloads:
        description: Comma-separated MODE:STREAMS
        default: 'bulk:1,bulk:10,bulk:100,bulk:1000,latency:1,latency:10,latency:100,loaded-latency:100,churn:16'
        type: string
      rings:
        description: Relay ring sizes in bytes, comma-separated
        default: '65536'
        type: string
      profiling:
        description: Optional Linux perf capability level
        type: choice
        default: basic
        options: [basic, perf-stat, perf-record]
      processes:
        description: Independent SO_REUSEPORT proxy processes
        type: choice
        default: '1'
        options: ['1', '2', '4']
      instrumentation:
        description: Also measure a compile-time diagnostic build
        type: boolean
        default: false
      architecture:
        description: Native runner architecture
        type: choice
        default: both
        options: [both, amd64, arm64]
      options:
        description: JSON options (chunk_bytes, inflight_bytes, warmup, variants, generator_workers, origin_io, baseline_ring, baseline_processes, cpu, relay_splice)
        type: string
        default: '{}'
permissions:
  contents: read
jobs:
  benchmark:
    name: Benchmark ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'both' && '["amd64","arm64"]' || format('["{0}"]', inputs.architecture)) }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-26.04' || 'ubuntu-26.04-arm' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Check out baseline independently
        if: inputs.baseline != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline }}
          path: .baseline
          persist-credentials: false
      - name: Zig 0.17.0 from the official release (verified SHA-256)
        shell: bash
        env:
          ZIG_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
          ZIG_SHA: ${{ matrix.arch == 'amd64' && '1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026' || '9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8' }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/0.17.0/zig-${ZIG_ARCH}-linux-0.17.0.tar.xz"
          echo "$ZIG_SHA  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/zig-${ZIG_ARCH}-linux-0.17.0/zig" version)" = 0.17.0
          "$RUNNER_TEMP/zig-${ZIG_ARCH}-linux-0.17.0/zig" version
          echo "$RUNNER_TEMP/zig-${ZIG_ARCH}-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Build ordinary production fast
        env:
          BENCH_OPTIONS: ${{ inputs.options }}
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import json,os; v=json.loads(os.environ["BENCH_OPTIONS"]).get("cpu","baseline"); assert v in ("baseline","native","x86_64_v3"); print(v)')
          splice=$(python3 -c 'import json,os; v=json.loads(os.environ["BENCH_OPTIONS"]).get("relay_splice",True); assert type(v) is bool; print(str(v).lower())')
          echo "BENCH_CPU=$cpu" >> "$GITHUB_ENV"
          echo "BENCH_SPLICE=$splice" >> "$GITHUB_ENV"
          zig build -Doptimize=fast -Dcpu="$cpu" -Drelay_splice="$splice" -Dbench_tools=true --prefix "$RUNNER_TEMP/candidate"
      - name: Build optional baseline with Zig 0.17.0
        if: inputs.baseline != ''
        working-directory: .baseline
        env:
          BENCH_OPTIONS: ${{ inputs.options }}
        run: |
          set -euo pipefail
          extra=()
          splice=$(python3 -c 'import json,os; v=json.loads(os.environ["BENCH_OPTIONS"]).get("baseline_splice"); assert v is None or type(v) is bool; print("" if v is None else str(v).lower())')
          if [[ -n "$splice" ]]; then extra+=(-Drelay_splice="$splice"); fi
          zig build -Doptimize=fast -Dcpu=baseline "${extra[@]}" --prefix "$RUNNER_TEMP/baseline"
          echo "BENCH_BASELINE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BENCH_BASELINE_ZIG_VERSION=$(zig version)" >> "$GITHUB_ENV"
          echo "BENCH_BASELINE_BUILD_MODE=fast" >> "$GITHUB_ENV"
      - name: Build optional diagnostic fast
        if: inputs.instrumentation
        run: zig build -Doptimize=fast -Dcpu="$BENCH_CPU" -Drelay_splice="$BENCH_SPLICE" -Ddataplane_metrics=true --prefix "$RUNNER_TEMP/metrics"
      - name: Measure paired workloads with coordinated CPU windows
        env:
          BENCH_BUILD_MODE: fast
          BENCH_DURATION: ${{ inputs.duration }}
          BENCH_REPEATS: ${{ inputs.repeats }}
          BENCH_ZIG_VERSION: '0.17.0'
          BENCH_WORKLOADS: ${{ inputs.workloads }}
          BENCH_RINGS: ${{ inputs.rings }}
          BENCH_PROFILING: ${{ inputs.profiling }}
          BENCH_PROCESSES: ${{ inputs.processes }}
          BENCH_OPTIONS: ${{ inputs.options }}
          HAVE_BASELINE: ${{ inputs.baseline != '' }}
          HAVE_METRICS: ${{ inputs.instrumentation }}
        run: |
          set -euo pipefail
          extra=()
          printf 'Candidate: Zig %s, %s\nBaseline: Zig %s, %s\n' \
            "$BENCH_ZIG_VERSION" "$BENCH_BUILD_MODE" "${BENCH_BASELINE_ZIG_VERSION:-none}" "${BENCH_BASELINE_BUILD_MODE:-none}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ "$HAVE_BASELINE" == true ]]; then extra+=(--baseline "$RUNNER_TEMP/baseline/bin/zigveil"); fi
          if [[ "$HAVE_METRICS" == true ]]; then extra+=(--metrics-binary "$RUNNER_TEMP/metrics/bin/zigveil"); fi
          python3 bench/ci.py --binary "$RUNNER_TEMP/candidate/bin/zigveil" "${extra[@]}" \
            --native-binary "$RUNNER_TEMP/candidate/bin/zigveil-bench" \
            --duration "$BENCH_DURATION" --repeats "$BENCH_REPEATS" \
            --workloads "$BENCH_WORKLOADS" --rings "$BENCH_RINGS" \
            --profiling "$BENCH_PROFILING" --processes "$BENCH_PROCESSES" --options "$BENCH_OPTIONS" \
            --output "$RUNNER_TEMP/zigveil-benchmarks"
      - name: Upload raw results, configuration and environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/zigveil-benchmarks/
          if-no-files-found: warn
          retention-days: 30
