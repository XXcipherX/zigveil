name: Publish Docker image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker tag to publish
        required: true
        default: latest
      production_mode:
        description: Production mode
        required: true
        type: choice
        default: fast
        options: [fast, safe]
      push_latest:
        description: Also publish latest
        type: boolean
        default: true
      publish_amd64_v3:
        description: Also publish an x86_64_v3 CPU image
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
concurrency:
  group: docker-image
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      v3_tags: ${{ steps.v3.outputs.tags }}
      v3_labels: ${{ steps.v3.outputs.labels }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-
      - id: v3
        if: inputs.publish_amd64_v3
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}-amd64-v3
            type=raw,value=latest-amd64-v3,enable=${{ inputs.push_latest }}
            type=sha,prefix=sha-,suffix=-amd64-v3
  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: PRODUCTION_MODE=${{ inputs.production_mode }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=publish-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-${{ matrix.arch }},mode=max
      - name: Verify image and export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          python3 test/docker_smoke.py --image "$IMAGE@$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-generic-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  build_v3:
    name: Build amd64-v3
    needs: prepare
    if: inputs.publish_amd64_v3
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            PRODUCTION_MODE=${{ inputs.production_mode }}
            ZIGVEIL_CPU=x86_64_v3
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.v3_labels }}
          cache-from: type=gha,scope=publish-amd64-v3
          cache-to: type=gha,scope=publish-amd64-v3,mode=max
      - name: Verify image and export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          python3 test/docker_smoke.py --image "$IMAGE@$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-amd64-v3
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  publish:
    needs: [prepare, build, build_v3]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
          && needs.build.result == 'success'
          && (needs.build_v3.result == 'success'
              || (!inputs.publish_amd64_v3 && needs.build_v3.result == 'skipped')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-generic-*
          path: ${{ runner.temp }}/digests/generic
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: inputs.publish_amd64_v3
        with:
          name: digests-amd64-v3
          path: ${{ runner.temp }}/digests/v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify platforms, then publish tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          V3_TAGS: ${{ needs.prepare.outputs.v3_tags }}
          PUBLISH_V3: ${{ inputs.publish_amd64_v3 }}
        run: |
          set -euo pipefail
          process_image() {
            local phase="$1" profile="$2" count="$3" platforms="$4" image_tags="$5" digest tag
            local -a digests=() sources=() tags=() tag_args=()
            mapfile -t digests < <(find "$RUNNER_TEMP/digests/$profile" -maxdepth 1 -type f -printf '%f\n' | sort)
            [[ "${#digests[@]}" -eq "$count" ]]
            for digest in "${digests[@]}"; do
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
              sources+=("$IMAGE@sha256:$digest")
            done
            mapfile -t tags <<< "$image_tags"
            for tag in "${tags[@]}"; do [[ -z "$tag" ]] || tag_args+=(--tag "$tag"); done
            [[ "${#tag_args[@]}" -gt 0 ]]
            if [[ "$phase" == verify ]]; then
              docker buildx imagetools create --dry-run "${sources[@]}" | jq -e --argjson expected "$platforms" '
                [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                  | "\(.platform.os)/\(.platform.architecture)"] | sort == ($expected | sort)
              ' > /dev/null
            else
              docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
              docker buildx imagetools inspect "${tags[0]}"
              printf '%s\n' "$image_tags" >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          for phase in verify publish; do
            process_image "$phase" generic 2 '["linux/amd64","linux/arm64"]' "$TAGS"
            if [[ "$PUBLISH_V3" == true ]]; then
              process_image "$phase" v3 1 '["linux/amd64"]' "$V3_TAGS"
            fi
          done
