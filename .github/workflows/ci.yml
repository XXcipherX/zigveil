name: Linux CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.cpu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cpu: baseline
            runner: ubuntu-26.04
            zig_arch: x86_64
            zig_sha: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          - arch: arm64
            cpu: baseline
            runner: ubuntu-26.04-arm
            zig_arch: aarch64
            zig_sha: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
          - arch: amd64
            cpu: x86_64_v3
            runner: ubuntu-26.04
            zig_arch: x86_64
            zig_sha: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ZIGVEIL_CPU: ${{ matrix.cpu }}
    steps:
      - uses: actions/checkout@v7
      - name: Zig 0.17.0 from the official release (verified SHA-256)
        id: zig
        shell: bash
        env:
          ZIG_ARCH: ${{ matrix.zig_arch }}
          ZIG_SHA: ${{ matrix.zig_sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/0.17.0/zig-${ZIG_ARCH}-linux-0.17.0.tar.xz"
          echo "$ZIG_SHA  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/zig-${ZIG_ARCH}-linux-0.17.0/zig" version)" = 0.17.0
          "$RUNNER_TEMP/zig-${ZIG_ARCH}-linux-0.17.0/zig" version
          echo "$RUNNER_TEMP/zig-${ZIG_ARCH}-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check build.zig src
      - name: Build debug
        id: debug
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          zig build -Dcpu="$ZIGVEIL_CPU"
          readelf -h zig-out/bin/zigveil | grep -E 'Type:.*DYN'
      - name: Deterministic unit tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: zig build test -Dcpu="$ZIGVEIL_CPU"
      - name: Parser mutations with safety checks
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: zig build fuzz -Doptimize=safe -Dcpu="$ZIGVEIL_CPU"
      - name: safe build and unit tests
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          zig build -Doptimize=safe -Dcpu="$ZIGVEIL_CPU" --prefix "$RUNNER_TEMP/safe"
          readelf -h "$RUNNER_TEMP/safe/bin/zigveil" | grep -E 'Type:.*DYN'
          zig build test -Doptimize=safe -Dcpu="$ZIGVEIL_CPU"
      - name: Python syntax and benchmark harness smoke
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          python3 -m py_compile test/*.py bench/*.py
          python3 bench/harness.py smoke
      - name: debug Linux socket integration
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        run: python3 test/integration.py --binary zig-out/bin/zigveil
      - name: debug controlled DNS integration
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        run: sudo python3 test/dns_integration.py --binary zig-out/bin/zigveil
      - name: fast build and unit tests
        id: release
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          zig build -Doptimize=fast -Dcpu="$ZIGVEIL_CPU"
          readelf -h zig-out/bin/zigveil | grep -E 'Type:.*DYN'
          zig build test -Doptimize=fast -Dcpu="$ZIGVEIL_CPU"
      - name: fast Linux socket integration
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: python3 test/integration.py --binary zig-out/bin/zigveil
      - name: fast controlled DNS integration
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: sudo python3 test/dns_integration.py --binary zig-out/bin/zigveil
      - name: Benchmark flow control, timeout and 1000-stream regressions
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          ulimit -n 8192
          timeout 120s python3 test/bench_harness.py --binary zig-out/bin/zigveil
      - name: Compile-time diagnostics and laboratory regressions
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          zig build test -Ddataplane_metrics=true -Dcpu="$ZIGVEIL_CPU"
          zig build test -Doptimize=fast -Ddataplane_metrics=true -Dcpu="$ZIGVEIL_CPU"
          cp zig-out/bin/zigveil "$RUNNER_TEMP/zigveil-normal"
          zig build -Doptimize=fast -Ddataplane_metrics=true -Dbench_tools=true -Dcpu="$ZIGVEIL_CPU"
          python3 test/integration.py --binary zig-out/bin/zigveil --diagnostics
          ulimit -n 32768
          timeout 120s python3 test/bench_harness.py --binary zig-out/bin/zigveil --native-binary zig-out/bin/zigveil-bench
          python3 test/bench_lab.py --binary zig-out/bin/zigveil --normal-binary "$RUNNER_TEMP/zigveil-normal" --native-binary zig-out/bin/zigveil-bench
      - name: Buffered build control
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          ulimit -n 32768
          zig build test -Drelay_splice=false -Dcpu="$ZIGVEIL_CPU"
          zig build test -Doptimize=safe -Drelay_splice=false -Dcpu="$ZIGVEIL_CPU"
          zig build test -Doptimize=fast -Drelay_splice=false -Ddataplane_metrics=true -Dcpu="$ZIGVEIL_CPU"
          zig build -Doptimize=fast -Drelay_splice=false -Ddataplane_metrics=true -Dbench_tools=true -Dcpu="$ZIGVEIL_CPU"
          python3 test/integration.py --binary zig-out/bin/zigveil --diagnostics
          python3 test/bench_lab.py --binary zig-out/bin/zigveil --native-binary zig-out/bin/zigveil-bench
      - name: Shared splice ownership and spill correctness
        if: ${{ !cancelled() && steps.zig.outcome == 'success' }}
        run: |
          ulimit -n 32768
          zig build test -Doptimize=safe -Ddataplane_metrics=true -Dcpu="$ZIGVEIL_CPU"
          zig build -Doptimize=fast -Drelay_splice=true -Ddataplane_metrics=true -Dbench_tools=true -Dcpu="$ZIGVEIL_CPU"
          python3 test/integration.py --binary zig-out/bin/zigveil --splice --diagnostics
          python3 bench/ci.py --binary zig-out/bin/zigveil --metrics-binary zig-out/bin/zigveil --native-binary zig-out/bin/zigveil-bench \
            --duration 1 --repeats 1 --workloads bulk:1000,loaded-latency:10,churn:1 --rings 65536 --profiling basic \
            --options '{"variants":["metrics"],"relay_splice":true,"generator_workers":2,"origin_io":"splice","warmup":0.05}' \
            --output "$RUNNER_TEMP/shared-splice-checks"
  docker:
    name: Docker ${{ matrix.arch }} ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            docker_arch: amd64
            cpu: baseline
            mode: fast
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: arm64
            cpu: baseline
            mode: fast
          - arch: amd64-v3
            runner: ubuntu-26.04
            docker_arch: amd64
            cpu: x86_64_v3
            mode: fast
          - arch: amd64
            runner: ubuntu-26.04
            docker_arch: amd64
            cpu: baseline
            mode: safe
          - arch: arm64
            runner: ubuntu-26.04-arm
            docker_arch: arm64
            cpu: baseline
            mode: safe
          - arch: amd64-v3
            runner: ubuntu-26.04
            docker_arch: amd64
            cpu: x86_64_v3
            mode: safe
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax and lint
        run: |
          bash -n deploy/install_docker_compose.sh
          sh -n docker-entrypoint.sh
          shellcheck docker-entrypoint.sh deploy/install_docker_compose.sh
      - uses: docker/setup-buildx-action@v4
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.docker_arch }}
          build-args: |
            ZIGVEIL_CPU=${{ matrix.cpu }}
            PRODUCTION_MODE=${{ matrix.mode }}
          load: true
          tags: zigveil:ci
          cache-from: type=gha,scope=ci-docker-${{ matrix.arch }}-${{ matrix.mode }}
          cache-to: type=gha,scope=ci-docker-${{ matrix.arch }}-${{ matrix.mode }},mode=max
      - name: Container smoke tests
        run: python3 test/docker_smoke.py --image zigveil:ci
      - name: Compose installer and update E2E
        if: matrix.arch == 'amd64' && matrix.mode == 'fast'
        run: sudo python3 test/installer_e2e.py --image zigveil:ci
